[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-panel"
version = "0.1.0"
description = "A reusable framework for pre-registered LLM-panel behavioral experiments on shared clusters (NRP-friendly)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Andrew H. Bond", email = "andrew.bond@sjsu.edu" }]
keywords = ["llm", "experiments", "pre-registration", "nrp", "behavioral-economics", "panel"]
dependencies = []

[project.optional-dependencies]
nrp = ["requests"]
analysis = ["numpy", "scipy", "statsmodels"]
dev = ["pytest", "ruff", "black"]

[tool.hatch.build.targets.wheel]
packages = ["llmpanel"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
